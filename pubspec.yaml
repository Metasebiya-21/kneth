name: sdui_demo
description: Minimal SDUI renderer demo for the Kifiya Agent App
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  image_picker: ^1.1.2
  path_provider: ^2.1.4
  shared_preferences: ^2.3.2
  flutter_riverpod: ^3.0.3
  http: ^1.5.0
  flutter_secure_storage: ^9.2.2
  kifiya_rendering_engine:
    path: ../kifiya_rendering_engine-main

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_secure_storage_platform_interface: ^1.1.2
  image_picker_platform_interface: ^2.11.1

flutter:
  uses-material-design: true
