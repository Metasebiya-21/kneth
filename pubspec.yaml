name: sdui_demo
description: Server-Driven UI Client for Kifiya Agent App
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.1
  image_picker: ^1.1.2
  path_provider: ^2.1.4
  shared_preferences: ^2.3.2
  flutter_riverpod: ^3.0.3
  kifiya_rendering_engine:
    path: ../kifiya_rendering_engine-main
  camera: ^0.12.1
  signature: ^6.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/

